<!DOCTYPE html>

<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Macchinari-bestrong</title>

        <link rel="stylesheet" href="macchinari.css">
        <!-- <link rel="stylesheet" href="{{ url_for('static', filename='css/macchinari.css') }}"> -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    </head>

    <body>
        <div class="app-container">
            <!-- Sidebar -->
            <aside class="sidebar" id="sidebar">
                <!-- Contenuto principale della sidebar -->
                <div class="sidebar-content">
                    <div class="logo">
                        <i class="fas fa-dumbbell"></i>
                        <span>BeStrong</span>
                    </div>
                    <nav class="nav-menu">
                        <ul>
                            <li><a href="{{ url_for('dashboard') }}"><i class="fas fa-home"></i> <span>Clienti</span></a></li>
                            <li><a href="{{ url_for('creazione_scheda') }}"><i class="fas fa-calendar-alt"></i> <span>Schede</span></a></li>
                            <li class="active"><a href="{{ url_for('macchinari') }}"><i class="fas fa-cogs"></i> <span>Macchinari</span></a></li>
                            <li><a href="{{ url_for('about') }}"><i class="fas fa-users"></i> <span>About</span></a></li>
                            <li><a href="{{ url_for('about') }}"><i class="fas fa-user"></i> <span>Profilo</span></a></li>
                            <li><a href="{{ url_for('logout') }}"><i class="fas fa-sign-out-alt"></i> <span>Logout</span></a></li>
                        </ul>
                    </nav>
                    <div class="trainer-profile">
                        <div class="avatar">
                            <span>GC</span>
                        </div>
                        <div class="trainer-info">
                            <h4>Giovanni Cei</h4>
                            <p>Cliente</p>
                        </div>
                    </div>
                </div>
                <!-- Parte visibile con pulsante menu -->
                <div class="sidebar-peek">
                    <button class="menu-toggle" id="menuToggle">
                        <i class="fas fa-bars"></i>
                    </button>
                </div>
            </aside>
    
            <!-- Main Content -->
            <main class="main-content">
                <header class="content-header">
                    <h1>Gestione Macchinari</h1>
                    <div class="search-container">
                        <input type="text" id="searchInput" placeholder="Cerca macchinario...">
                        <i class="fas fa-search"></i>
                    </div>
                    <button class="add-client-btn" id="addMachineBtn">
                        <i class="fas fa-plus"></i>
                        <span>Nuovo Macchinario</span>
                    </button>
                </header>
    
                <!-- Machines Grid -->
                <section class="clients-grid" id="machinesGrid">
                    <!-- Contenuto generato dinamicamente da JavaScript -->
                    <div class="loading">
                        <i class="fas fa-spinner fa-spin"></i>
                        <span>Caricamento macchinari...</span>
                    </div>
                </section>
            </main>
        </div>
        
    <!-- Modal per Aggiungere un Macchinario -->
    <div class="modal" id="addMachineModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Aggiungi Nuovo Macchinario</h2>
                <span class="close-modal" id="closeAddModal">&times;</span>
            </div>
            <div class="modal-body">
                <form id="addMachineForm">
                    <div class="form-group">
                        <label for="nome">Nome Macchinario</label>
                        <input type="text" id="nome" name="nome" required>
                    </div>
                    <div class="form-group">
                        <label for="tipologia">Tipologia</label>
                        <select id="tipologia" name="tipologia" required>
                            <option value="">Seleziona una tipologia</option>
                            <option value="cardio">Cardio</option>
                            <option value="forza">Forza</option>
                            <option value="isotonica">Isotonica</option>
                            <option value="elastica">Elastica</option>
                            <option value="funzionale">Funzionale</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="parteCorpo">Parte del Corpo</label>
                        <select id="parteCorpo" name="parteCorpo" required>
                            <option value="">Seleziona parte del corpo</option>
                            <option value="petto">Petto</option>
                            <option value="spalle">Spalle</option>
                            <option value="braccia">Braccia</option>
                            <option value="schiena">Schiena</option>
                            <option value="gambe">Gambe</option>
                            <option value="core">Core</option>
                            <option value="total">Total Body</option>
                        </select>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn-cancel" id="cancelAddMachine">Annulla</button>
                        <button type="submit" class="btn-submit">Salva Macchinario</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal per Visualizzare i Dettagli Macchinario -->
    <div class="modal" id="machineDetailsModal">
        <div class="modal-content modal-large">
            <div class="modal-header">
                <h2 id="machineDetailsName">Dettagli Macchinario</h2>
                <span class="close-modal" id="closeDetailsModal">&times;</span>
            </div>
            <div class="modal-body client-details">
                <div class="client-details-header">
                    <div class="client-avatar large">
                        <span id="machineIcon"><i class="fas fa-dumbbell"></i></span>
                    </div>
                    <div class="client-summary">
                        <h3 id="machineFullName"></h3>
                        <span class="client-objective" id="machineBodyPart"></span>
                    </div>
                    <div class="client-actions">
                        <button class="btn-edit" id="editMachineBtn">
                            <i class="fas fa-edit"></i> Modifica
                        </button>
                        <button class="btn-delete" id="deleteMachineBtn">
                            <i class="fas fa-trash"></i> Elimina
                        </button>
                    </div>
                </div>

                <div class="client-tabs">
                    <ul class="tabs-nav">
                        <li class="active" data-tab="info">Informazioni</li>
                        <li data-tab="notes">Note</li>
                    </ul>

                    <div class="tab-content active" id="info">
                        <div class="info-grid">
                            <div class="info-item">
                                <h4>Tipologia</h4>
                                <p id="machineType">--</p>
                            </div>
                            <div class="info-item">
                                <h4>Parte del Corpo</h4>
                                <p id="machineBodyPartDetail">--</p>
                            </div>
                        </div>
                    </div>

                    <div class="tab-content" id="notes">
                        <div class="notes-container">
                            <h3>Note e Osservazioni</h3>
                            <div class="notes-editor">
                                <textarea id="machineNotes" placeholder="Aggiungi note sul macchinario..."></textarea>
                                <button class="btn-save-notes" id="saveNotesBtn">Salva Note</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- <script src="{{ url_for('static', filename='js/macchinari.js') }}"></script> -->
    <script src="macchinari.js"></script>

    </body>
</html>
