<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeStrong - Profilo</title>
    <link rel="stylesheet" href="profilo.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <!-- Contenuto principale della sidebar -->
            <div class="sidebar-content">
                <div class="logo">
                    <i class="fas fa-dumbbell"></i>
                    <span>BeStrong</span>
                </div>
                <nav class="nav-menu">
                    <ul>
                        <li><a href="#"><i class="fas fa-home"></i> <span>Home</span></a></li>
                        <li class="active"><a href="#"><i class="fas fa-user"></i> <span>Profilo</span></a></li>
                        <li><a href="#"><i class="fas fa-users"></i> <span>Chi Siamo</span></a></li>
                        <li><a href="#"><i class="fas fa-calendar-alt"></i> <span>Programmazione</span></a></li>
                        <li><a href="#"><i class="fas fa-cog"></i> <span>Impostazioni</span></a></li>
                        <li><a href="#"><i class="fas fa-sign-out-alt"></i> <span>Logout</span></a></li>
                    </ul>
                </nav>
                <div class="trainer-profile">
                    <div class="avatar">
                        <span>GC</span>
                    </div>
                    <div class="trainer-info">
                        <h4>Giovanni Cei</h4>
                        <p>Cliente</p>
                    </div>
                </div>
            </div>
            <!-- Parte visibile con pulsante menu -->
            <div class="sidebar-peek">
                <button class="menu-toggle" id="menuToggle">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content" id="mainContent">

            <!-- Stats Cards -->
            <div class="stats-container">
                <h2>Le tue statistiche</h2>
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-icon">
                            <i class="fas fa-calendar-check"></i>
                        </div>
                        <div class="stat-info">
                            <h3>Allenamenti</h3>
                            <p class="stat-value">45</p>
                            <p class="stat-label">Questo mese</p>
                        </div>
                    </div>

                    <div class="stat-card">
                        <div class="stat-icon">
                            <i class="fas fa-fire-alt"></i>
                        </div>
                        <div class="stat-info">
                            <h3>Calorie</h3>
                            <p class="stat-value">15.250</p>
                            <p class="stat-label">Bruciate</p>
                        </div>
                    </div>

                    <div class="stat-card">
                        <div class="stat-icon">
                            <i class="fas fa-stopwatch"></i>
                        </div>
                        <div class="stat-info">
                            <h3>Tempo</h3>
                            <p class="stat-value">28h</p>
                            <p class="stat-label">Di allenamento</p>
                        </div>
                    </div>

                    <div class="stat-card">
                        <div class="stat-icon">
                            <i class="fas fa-chart-line"></i>
                        </div>
                        <div class="stat-info">
                            <h3>Progressi</h3>
                            <p class="stat-value">85%</p>
                            <p class="stat-label">Obiettivi raggiunti</p>
                        </div>
                    </div>
                </div>
            </div> <br><br><br>

            

    <script src="profilo.js"></script>
</body>
</html>
