<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeStrong - Esercizio</title>
    <link rel="stylesheet" href="schermata_esecuzione.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
</head>

<body>
    <header>
        <div class="logo">
            <i class="fas fa-dumbbell"></i>
            <h1>BeStrong</h1>
        </div>
        <nav>
            <ul>
                <li><a href="#" class="active">Allenamento</a></li>
                <li><a href="#">Schede</a></li>
                <li><a href="#">Profilo</a></li>
            </ul>
        </nav>
    </header>

    <section class="exercise-container">
        <div class="exercise-header">
            <h2 id="exercise-name">Squat</h2>
            <div class="badge">Gambe</div>
        </div>

        <div class="video-container">
            <div class="video-wrapper">
                <video id="exercise-video" controls>
                    <source src="/api/placeholder/640/360" type="video/mp4">
                    Il tuo browser non supporta il tag video.
                </video>
                <div class="video-overlay">
                    <button id="play-btn" class="play-button">
                        <i class="fas fa-play"></i>
                    </button>
                </div>
            </div>
            
            <div class="exercise-info">
                <div class="info-box sets">
                    <span class="label">Serie</span>
                    <span class="value">4</span>
                </div>
                <div class="info-box reps">
                    <span class="label">Ripetizioni</span>
                    <span class="value">12</span>
                </div>
                <div class="info-box rest">
                    <span class="label">Riposo</span>
                    <span class="value">60s</span>
                </div>
            </div>
        </div>


        </section>

</body>

</html>
