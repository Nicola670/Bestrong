<!DOCTYPE html>
<html lang="it">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>BeStrong - Creazione Scheda Allenamento</title>
        <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
        <link rel="stylesheet" href="creazione_scheda.css">
    </head>

    <body>
        <div class="container mx-auto px-4 py-8">
            <header class="mb-8">
                <h1 class="text-3xl font-bold text-center text-blue-700">BeStrong</h1>
                <h2 class="text-xl text-center text-gray-600">Creazione Nuova Scheda di Allenamento</h2>
            </header>

            <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
                <form id="scheda-form">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                        <div>
                            <label for="cliente-nome" class="block text-gray-700 font-semibold mb-2">Cliente</label>
                            <div id="cliente-nome" class="w-full px-4 py-2 border rounded-lg bg-gray-100 font-medium"></div>
                            <input type="hidden" id="cliente-id" name="cliente-id">
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <script src="creazione_scheda.js"></script>
    </body>

</html>
