<!DOCTYPE html>
<html lang="it">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>BeStrong - Creazione Scheda Allenamento</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="creazione_scheda.css">
    </head>

    <body>
        <header class="mb-8">
            <h1 class="text-3xl font-bold text-center text-blue-700">BeStrong</h1>
            <h2 class="text-xl text-center text-gray-600">Creazione Nuova Scheda di Allenamento</h2>
        </header>

        <div class="row">
            <div class="col-md-12 mb-4">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h3 class="card-title mb-0">Informazioni Cliente</h3>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-6">
                                <p class="fw-bold">ID Cliente: <span id="clienteId"></span></p>
                                <p class="fw-bold">Nome: <span id="clienteNome">Caricamento...</span></p>
                            </div>
                            <div class="col-md-6">
                                <p class="fw-bold">Email: <span id="clienteEmail">Caricamento...</span></p>
                                <p class="fw-bold">Telefono: <span id="clienteTelefono">Caricamento...</span></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6">
                <div class="card mb-4">
                    <div class="card-header bg-success text-white">
                        <h3 class="card-title mb-0">Esercizi Disponibili</h3>
                        <div class="d-flex justify-content-between align-items-center mt-2">
                            <div class="input-group input-group-sm" style="max-width: 300px;">
                                <input type="text" class="form-control" id="searchEsercizi" placeholder="Cerca esercizi...">
                                <button class="btn btn-light" type="button" id="btnSearch">
                                    <i class="bi bi-search"></i> Cerca
                                </button>
                            </div>
                            
                            <div class="dropdown">
                                <button class="btn btn-light btn-sm dropdown-toggle" type="button" id="dropdownGruppiMuscolari" data-bs-toggle="dropdown" aria-expanded="false">
                                    Filtra per gruppo
                                </button>
                                <ul class="dropdown-menu" id="filtroGruppiMuscolari" aria-labelledby="dropdownGruppiMuscolari">
                                    <li><a class="dropdown-item active" href="#" data-gruppo="tutti">Tutti</a></li>
                                    <!-- I gruppi muscolari saranno aggiunti dinamicamente -->
                                </ul>
                            </div>
                        </div>
                    </div>
                    <div class="card-body">
                        <div id="eserciziList" class="row row-cols-1 row-cols-md-2 g-3">
                            <!-- Gli esercizi saranno inseriti qui dinamicamente -->
                        </div>
                    </div>
                </div>
            </div>


        <script src="creazione_scheda.js"></script>
    </body>

</html>
