<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeStrong - Login</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <div class="main">
        <input type="checkbox" id="chk" aria-hidden="true">

        <div class="signup">
            <form action="register.php" method="POST">
                <label class="form_lbl" for="chk" aria-hidden="true">Registrati</label>
                <input type="text" name="username" placeholder="Username" required aria-label="Inserisci il tuo username">
                <input type="email" name="email" placeholder="Email" required aria-label="Inserisci la tua email">
                <input type="password" name="pswd" placeholder="Password" required aria-label="Inserisci la tua password">
                <button type="submit">Sign up</button>
            </form>
        </div>

        <div class="login">
            <form action="login.php" method="POST">
                <label class="form_lbl" for="chk" aria-hidden="true">Login</label>
                <input type="email" name="email" placeholder="Email" required aria-label="Inserisci la tua email">
                <input type="password" name="pswd" placeholder="Password" required aria-label="Inserisci la tua password">
                <button type="submit">Login</button>
            </form>
        </div>
    </div>
</body>

</html>
