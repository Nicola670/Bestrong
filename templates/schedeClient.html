<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeStrong - Dashboard Cliente</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/schedeClient.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-content">
                <div class="logo">
                    <i class="fas fa-dumbbell"></i>
                    <span>BeStrong</span>
                </div>
                <nav class="nav-menu">
                    <ul>
                        <li><a href="{{ url_for('client_dashboard') }}"><i class="fas fa-home"></i> <span>Home</span></a></li>
                        <li><a href="{{ url_for('profile') }}"><i class="fas fa-user"></i> <span>Profilo</span></a></li>
                        <li><a href="{{ url_for('about') }}"><i class="fas fa-users"></i> <span>Chi Siamo</span></a></li>
                        <li><a href="{{ url_for('logout') }}"><i class="fas fa-sign-out-alt"></i> <span>Logout</span></a></li>
                    </ul>
                </nav>
                <div class="trainer-profile">
                    <div class="avatar">
                        <span id="userInitials">--</span>
                    </div>
                    <div class="trainer-info">
                        <h4 id="userName">Caricamento...</h4>
                        <p id="userRole">Cliente</p>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content" id="mainContent">
            <div class="content-header">
                <h1>Le tue schede</h1>
                <div class="search-container">
                    <input type="text" id="searchInput" placeholder="Cerca scheda...">
                    <i class="fas fa-search"></i>
                </div>
            </div>
            <div class="clients-grid" id="schedeGrid">
                <!-- Le schede verranno caricate qui dinamicamente -->
            </div>
        </main>

        <!-- Modal per i dettagli della scheda -->
        <div class="modal" id="schedaDetailsModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Dettagli Scheda</h2>
                    <button id="closeModal"><i class="fas fa-times"></i></button>
                </div>
                <div class="modal-body">
                    <!-- Il contenuto del modal verrà caricato dinamicamente -->
                </div>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/schedeClient.js') }}"></script>
</body>
</html>
