<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeStrong - Esercizio</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/schermata_esecuzione.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
</head>

<body>
    <header>
        <div class="logo">
            <i class="fas fa-dumbbell"></i>
            <h1>BeStrong</h1>
        </div>
    </header>
    <main>
        <section class="exercise-container">
            <div class="exercise-header">
                <h2 id="exercise-name">Squat</h2>
                <div class="badge">Gambe</div>
            </div>
    
            <div class="video-container">
                <div class="video-wrapper">
                    <video id="exercise-video" controls>
                        <source src="/api/placeholder/640/360" type="video/mp4">
                        Il tuo browser non supporta il tag video.
                    </video>
                    <div class="video-overlay">
                        <button id="play-btn" class="play-button">
                            <i class="fas fa-play"></i>
                        </button>
                    </div>
                </div>
                
                <div class="exercise-info">
                    <div class="info-box weight">
                        <span class="label">Peso</span>
                        <span class="value">0kg</span>
                    </div>
                    <div class="info-box sets">
                        <span class="label">Serie</span>
                        <span class="value">4</span>
                    </div>
                    <div class="info-box reps">
                        <span class="label">Ripetizioni</span>
                        <span class="value">12</span>
                    </div>
                    <div class="info-box rest">
                        <span class="label">Riposo</span>
                        <span class="value">60s</span>
                    </div>
                </div>
            </div>
            <div class="timer-container">
                <div class="timer-display">
                    <div id="timer">01:00</div>
                    <div class="timer-controls">
                        <button id="start-timer" class="timer-btn">
                            <i class="fas fa-play"></i>
                        </button>
                        <button id="pause-timer" class="timer-btn">
                            <i class="fas fa-pause"></i>
                        </button>
                        <button id="reset-timer" class="timer-btn">
                            <i class="fas fa-redo"></i>
                        </button>
                    </div>
                </div>
                <div class="progress-container">
                    <div id="timer-progress" class="progress-bar"></div>
                </div>
            </div>
        </section>
        <section class="instructions">
            <h3>Istruzioni</h3>
            <p>
                1. jnvsVJ <br>
                2.disn  sdnm kjsdkjn dnszl<br>
                3. ijda  szN id m  iksdm m<br>
                4. Va casa
            </p>
        </section>

        <div class="navigation-buttons">
            <button id="prev-exercise" class="nav-btn">
                <i class="fas fa-arrow-left"></i> Esercizio precedente
            </button>
            <button id="finish-workout" class="nav-btn primary" onclick="window.location.href='/client'">
                <i class="fas fa-check"></i> Fine
            </button>
            <button id="next-exercise" class="nav-btn primary">
                Esercizio successivo <i class="fas fa-arrow-right"></i>
            </button>
        </div>

    </main>
    
    <footer>
        <p>&copy; 2025 BeStrong - Tutti i diritti riservati</p>
    </footer>

    <script src="{{ url_for('static', filename='js/schermata_esecuzione.js') }}"></script>

</body>

</html>
