<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambio Password - BeStrong</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/change_password.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <i class="fas fa-lock"></i>
            <h1>Cambio Password</h1>
            <p>Per motivi di sicurezza, è necessario impostare una nuova password al primo accesso</p>
        </div>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="error-message">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form id="changePasswordForm" method="POST" data-url="{{ url_for('change_password') }}">
            <div class="form-group">
                <label for="new_password">Nuova Password</label>
                <input type="password" id="new_password" name="new_password" required>
            </div>

            <div class="form-group">
                <label for="confirm_password">Conferma Password</label>
                <input type="password" id="confirm_password" name="confirm_password" required>
            </div>

            <button type="submit">Cambia Password</button>
        </form>
    </div>

    <script src="js/change_password.js"></script>
    <script src="{{ url_for('static', filename='js/change_password.js') }}"></script>
</body>
</html>
