<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeStrong - Chi Siamo</title>
    <link rel="stylesheet" href="About.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <!-- Contenuto principale della sidebar -->
            <div class="sidebar-content">
                <div class="logo">
                    <i class="fas fa-dumbbell"></i>
                    <span>BeStrong</span>
                </div>
                <nav class="nav-menu">
                    <ul>
                        <li><a href="#"><i class="fas fa-home"></i> <span>Home</span></a></li>
                        <li class="active"><a href="#"><i class="fas fa-users"></i> <span>Chi Siamo</span></a></li>
                        <li><a href="#"><i class="fas fa-calendar-alt"></i> <span>Programmazione</span></a></li>
                        <li><a href="#"><i class="fas fa-cog"></i> <span>Impostazioni</span></a></li>
                        <li><a href="#"><i class="fas fa-sign-out-alt"></i> <span>Logout</span></a></li>
                    </ul>
                </nav>
                <div class="trainer-profile">
                    <div class="avatar">
                        <span>GC</span>
                    </div>
                    <div class="trainer-info">
                        <h4>Giovanni Cei</h4>
                        <p>Cliente</p>
                    </div>
                </div>
            </div>
            <!-- Parte visibile con pulsante menu -->
            <div class="sidebar-peek">
                <button class="menu-toggle" id="menuToggle">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
        </aside>

        
</body>
</html>
